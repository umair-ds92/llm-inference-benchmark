[tool.poetry]
name = "llm-inference-benchmark"
version = "0.1.0"
description = "Comprehensive LLM inference benchmarking system for production deployment decisions"
authors = ["Muhammad Umair <umair.ds92@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/llm-inference-benchmark"
repository = "https://github.com/yourusername/llm-inference-benchmark"
keywords = ["llm", "benchmarking", "inference", "performance", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.1.0"
transformers = "^4.35.0"
vllm = "^0.2.6"
accelerate = "^0.24.0"
openai = "^1.3.0"
anthropic = "^0.7.0"
numpy = "^1.24.0"
pandas = "^2.1.0"
datasets = "^2.14.0"
prometheus-client = "^0.19.0"
psutil = "^5.9.0"
py-cpuinfo = "^9.0.0"
gputil = "^1.4.0"
nvidia-ml-py = "^12.535.0"
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
plotly = "^5.17.0"
streamlit = "^1.28.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
loguru = "^0.7.2"
tqdm = "^4.66.0"
rich = "^13.6.0"
httpx = "^0.25.0"
aiohttp = "^3.9.0"
requests = "^2.31.0"
jupyter = "^1.0.0"
ipykernel = "^6.25.0"
ipywidgets = "^8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-asyncio = "^0.21.0"
black = "^23.10.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
mypy = "^1.6.0"
py-spy = "^0.3.14"
memory-profiler = "^0.61.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]