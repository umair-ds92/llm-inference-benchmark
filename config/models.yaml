# Model Configuration for LLM Inference Benchmarking
# This file defines all models to be benchmarked

models:
  # Open-Source Models (deployed via vLLM)
  - name: "llama-2-7b"
    display_name: "Llama-2-7B"
    backend: "vllm"
    model_id: "meta-llama/Llama-2-7b-hf"
    quantization: "fp16"  # Options: fp16, int8, int4
    max_model_len: 4096
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.9
    description: "Meta's 7B parameter general-purpose model"
    license: "Llama 2 Community License"
    cost_per_hour: 1.006  # g5.xlarge AWS pricing
    parameters: "7B"

  - name: "llama-2-13b"
    display_name: "Llama-2-13B"
    backend: "vllm"
    model_id: "meta-llama/Llama-2-13b-hf"
    quantization: "fp16"
    max_model_len: 4096
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.9
    description: "Meta's 13B parameter model for complex tasks"
    license: "Llama 2 Community License"
    cost_per_hour: 1.515  # g5.2xlarge AWS pricing
    parameters: "13B"

  - name: "mistral-7b-instruct"
    display_name: "Mistral-7B-Instruct-v0.2"
    backend: "vllm"
    model_id: "mistralai/Mistral-7B-Instruct-v0.2"
    quantization: "fp16"
    max_model_len: 8192  # Mistral supports longer context
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.9
    description: "Mistral AI's efficient instruction-following model"
    license: "Apache 2.0"
    cost_per_hour: 1.006  # g5.xlarge AWS pricing
    parameters: "7B"

  - name: "phi-3-mini"
    display_name: "Phi-3-Mini-4K-Instruct"
    backend: "vllm"
    model_id: "microsoft/Phi-3-mini-4k-instruct"
    quantization: "fp16"
    max_model_len: 4096
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.9
    description: "Microsoft's compact high-performance model"
    license: "MIT"
    cost_per_hour: 1.006  # g5.xlarge AWS pricing (can run on smaller)
    parameters: "3.8B"

  # API-Based Models
  - name: "gpt-3.5-turbo"
    display_name: "GPT-3.5-Turbo"
    backend: "openai_api"
    model_id: "gpt-3.5-turbo"
    max_tokens: 4096
    description: "OpenAI's production-ready model"
    license: "Proprietary"
    cost_per_1m_tokens_input: 0.50  # USD
    cost_per_1m_tokens_output: 1.50  # USD
    parameters: "~175B (estimated)"

  - name: "claude-haiku"
    display_name: "Claude-3-Haiku"
    backend: "anthropic_api"
    model_id: "claude-3-haiku-20240307"
    max_tokens: 4096
    description: "Anthropic's fast, affordable model"
    license: "Proprietary"
    cost_per_1m_tokens_input: 0.25  # USD
    cost_per_1m_tokens_output: 1.25  # USD
    parameters: "Undisclosed"

# vLLM Configuration Defaults
vllm_defaults:
  swap_space: 4  # GB
  max_num_batched_tokens: 8192
  max_num_seqs: 256
  gpu_memory_utilization: 0.9
  enforce_eager: false  # Use CUDA graphs for better performance
  trust_remote_code: true  # Required for some models

# Quantization Options
quantization_configs:
  fp16:
    dtype: "float16"
    memory_reduction: 1.0  # baseline
    quality_degradation: 0.0  # minimal
    
  int8:
    dtype: "int8"
    memory_reduction: 0.5  # ~50% memory savings
    quality_degradation: 0.02  # ~2% quality loss
    method: "dynamic"  # or "static" with calibration
    
  int4:
    dtype: "int4"
    memory_reduction: 0.25  # ~75% memory savings
    quality_degradation: 0.05  # ~5% quality loss
    method: "gptq"  # or "awq"

# Model Selection Presets
presets:
  quick_test:
    # For rapid testing
    - "phi-3-mini"
    - "llama-2-7b"
  
  cost_optimized:
    # Best bang for buck
    - "mistral-7b-instruct"
    - "phi-3-mini"
    - "claude-haiku"
  
  quality_focused:
    # Maximum quality
    - "llama-2-13b"
    - "gpt-3.5-turbo"
  
  full_suite:
    # Complete benchmark
    - "llama-2-7b"
    - "llama-2-13b"
    - "mistral-7b-instruct"
    - "phi-3-mini"
    - "gpt-3.5-turbo"
    - "claude-haiku"